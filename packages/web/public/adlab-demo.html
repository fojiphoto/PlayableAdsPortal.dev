<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Miner: AdLab demo playable</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a6dcc4; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-label="A miner taps crystals and collects gems" role="img"></canvas>
<script>
(function () {
  "use strict";
  // A self-contained demo: a miner chips gems out of crystals, a counter fills up, an INSTALL
  // button pops in, then the whole scene restarts. Everything is drawn from the clock (render(t)),
  // so there is no state to reset between loops. No network requests.
  var LOOP = 11;                               // seconds
  var HITS = [1.2, 2.2, 3.2, 4.9, 5.9, 6.9];   // pickaxe strikes; every third one shatters the crystal
  var GROW = [0, 3.55, 7.3];                   // when each crystal appears
  var CTA_AT = 7.5;
  var FLY = 0.55;                              // gem flight time to the counter

  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!running) render(STILL);
  }

  // ── helpers ──
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function back(x) { x = clamp(x, 0, 1); var c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function gem(x, y, r) { // small faceted gem, used for shards, the flying pickup and the counter icon
    poly([x, y - r, x + r * 0.85, y - r * 0.2, x, y + r, x - r * 0.85, y - r * 0.2], "#34d399");
    poly([x, y - r, x + r * 0.85, y - r * 0.2, x, y - r * 0.05], "#d1fae5");
    poly([x, y + r, x + r * 0.85, y - r * 0.2, x, y - r * 0.05], "#047857");
  }
  function hitsBefore(t) { var n = 0; for (var i = 0; i < HITS.length; i++) if (HITS[i] <= t) n++; return n; }

  // ── layout (world units: 270 wide, origin on the ground, centred) ──
  var s, gx, gy;
  function toScreen(x, y) { return [gx + x * s, gy + y * s]; }
  var CRYSTAL_X = 52, MINER_X = -58;

  function background(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#9ed9c0"); g.addColorStop(0.62, "#e6f5dc"); g.addColorStop(1, "#fff6dc");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun
    var sx = W * 0.8, sy = H * 0.13, sr = 26 * s;
    var halo = ctx.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 2.6);
    halo.addColorStop(0, "rgba(253,230,138,.85)"); halo.addColorStop(1, "rgba(253,230,138,0)");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sx, sy, sr * 2.6, 0, 7); ctx.fill();
    ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    // clouds drift slowly
    cloud(((t * 9) % (W + 160)) - 80, H * 0.2, s);
    cloud(((t * 6 + W * 0.55) % (W + 160)) - 80, H * 0.31, s * 0.75);
    // mountains
    ctx.fillStyle = "#a9cfb2";
    ctx.beginPath(); ctx.moveTo(0, gy - 40 * s);
    ctx.lineTo(W * 0.22, gy - 150 * s); ctx.lineTo(W * 0.45, gy - 70 * s); ctx.lineTo(W * 0.68, gy - 175 * s);
    ctx.lineTo(W, gy - 60 * s); ctx.lineTo(W, gy); ctx.lineTo(0, gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fffdf6"; // snow caps
    poly([W * 0.68, gy - 175 * s, W * 0.68 + 26 * s, gy - 145 * s, W * 0.68 + 6 * s, gy - 150 * s, W * 0.68 - 12 * s, gy - 140 * s, W * 0.68 - 28 * s, gy - 146 * s], "#fffdf6");
    poly([W * 0.22, gy - 150 * s, W * 0.22 + 22 * s, gy - 124 * s, W * 0.22 + 4 * s, gy - 128 * s, W * 0.22 - 20 * s, gy - 122 * s], "#fffdf6");
    ctx.fillStyle = "#7fb592";
    ctx.beginPath(); ctx.moveTo(0, gy - 20 * s); ctx.lineTo(W * 0.35, gy - 95 * s); ctx.lineTo(W * 0.6, gy - 30 * s);
    ctx.lineTo(W * 0.85, gy - 85 * s); ctx.lineTo(W, gy - 40 * s); ctx.lineTo(W, gy); ctx.lineTo(0, gy); ctx.closePath(); ctx.fill();
    // ground
    ctx.fillStyle = "#eadbae"; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = "#7cb342"; ctx.fillRect(0, gy, W, 7 * s);
    ctx.fillStyle = "#d8c690";
    for (var i = 0; i < 9; i++) {
      ctx.beginPath(); ctx.ellipse(rnd(i + 3) * W, gy + (22 + rnd(i + 9) * (H - gy - 30) * 0.8) * 1, (5 + rnd(i) * 8) * s, (3 + rnd(i) * 3) * s, 0, 0, 7); ctx.fill();
    }
  }
  function cloud(x, y, k) {
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.beginPath();
    ctx.arc(x, y, 16 * k, 0, 7); ctx.arc(x + 18 * k, y - 8 * k, 20 * k, 0, 7); ctx.arc(x + 40 * k, y, 15 * k, 0, 7);
    ctx.fill(); rr(x - 4 * k, y - 2 * k, 50 * k, 16 * k, 8 * k); ctx.fill();
  }

  function crystal(t) {
    var n = hitsBefore(t), idx = t >= GROW[2] ? 2 : t >= GROW[1] ? 1 : 0;
    var born = GROW[idx], localHits = n - idx * 3;
    var shattered = localHits >= 3;
    if (shattered) return;
    var grow = back((t - born) / 0.5);
    var last = n > 0 ? HITS[n - 1] : -9, since = t - last;
    var shake = since < 0.3 ? Math.sin(since * 70) * (1 - since / 0.3) * 4 : 0;
    ctx.save();
    ctx.translate(gx + (CRYSTAL_X + shake) * s, gy);
    ctx.scale(s * grow * 1.2, s * grow * 1.2);
    // rock base
    ctx.fillStyle = "#94a3b8"; rr(-34, -12, 68, 18, 9); ctx.fill();
    ctx.fillStyle = "#cbd5e1"; rr(-28, -12, 40, 6, 3); ctx.fill();
    // three spikes
    spike(-18, -8, 14, 46, -0.28);
    spike(16, -8, 13, 42, 0.3);
    spike(0, -10, 19, 72, 0);
    // cracks grow with each hit
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2; ctx.lineCap = "round";
    if (localHits >= 1) { ctx.beginPath(); ctx.moveTo(-4, -60); ctx.lineTo(3, -48); ctx.lineTo(-3, -38); ctx.stroke(); }
    if (localHits >= 2) { ctx.beginPath(); ctx.moveTo(6, -34); ctx.lineTo(-2, -24); ctx.lineTo(5, -14); ctx.moveTo(-20, -40); ctx.lineTo(-15, -30); ctx.stroke(); }
    // sparkle
    var tw = (Math.sin(t * 5) + 1) / 2;
    ctx.fillStyle = "rgba(255,255,255," + (0.4 + tw * 0.6) + ")";
    star(-6, -70, 3 + tw * 2);
    ctx.restore();
  }
  function spike(x, y, w, h, a) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    poly([-w, 0, -w, -h * 0.72, 0, -h, w, -h * 0.72, w, 0], "#059669");
    poly([-w, 0, -w, -h * 0.72, 0, -h, 0, 0], "#34d399");
    poly([-w * 0.55, -h * 0.15, -w * 0.55, -h * 0.68, -w * 0.15, -h * 0.82, -w * 0.15, -h * 0.25], "rgba(209,250,229,.75)");
    ctx.restore();
  }
  function star(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * 0.5, y - r * 0.5); ctx.lineTo(x + r * 2, y); ctx.lineTo(x + r * 0.5, y + r * 0.5);
    ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * 0.5, y + r * 0.5); ctx.lineTo(x - r * 2, y); ctx.lineTo(x - r * 0.5, y - r * 0.5);
    ctx.closePath(); ctx.fill();
  }

  function pickAngle(t) {
    // rest at 0.35 rad; wind up before each strike, slam down on it, recover
    var a = 0.35 + Math.sin(t * 3) * 0.04;
    for (var i = 0; i < HITS.length; i++) {
      var d = t - HITS[i];
      if (d > -0.38 && d <= 0) a = 0.35 - 2.1 * ease((d + 0.38) / 0.3);
      else if (d > 0 && d < 0.08) a = -1.75 + 2.6 * (d / 0.08);
      else if (d >= 0.08 && d < 0.4) a = 0.85 - 0.5 * ease((d - 0.08) / 0.32);
    }
    return a;
  }

  function miner(t) {
    var bob = Math.sin(t * 3) * 1.2;
    ctx.save();
    ctx.translate(gx + MINER_X * s, gy);
    ctx.scale(s, s);
    // shadow
    ctx.fillStyle = "rgba(120,72,20,.22)"; ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, 7); ctx.fill();
    // boots + legs
    ctx.fillStyle = "#334155"; rr(-17, -9, 15, 10, 4); ctx.fill(); rr(3, -9, 15, 10, 4); ctx.fill();
    ctx.fillStyle = "#11704f"; rr(-15, -36, 12, 29, 4); ctx.fill(); rr(4, -36, 12, 29, 4); ctx.fill();
    ctx.translate(0, bob);
    // body: orange shirt + overall bib
    ctx.fillStyle = "#f97316"; rr(-20, -72, 41, 40, 13); ctx.fill();
    ctx.fillStyle = "#11704f"; rr(-13, -58, 27, 26, 6); ctx.fill();
    ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(-7, -53, 2.2, 0, 7); ctx.arc(8, -53, 2.2, 0, 7); ctx.fill();
    // head
    ctx.fillStyle = "#ffd2a6"; ctx.beginPath(); ctx.arc(1, -88, 17, 0, 7); ctx.fill();
    ctx.fillStyle = "#f4a3a3"; ctx.beginPath(); ctx.arc(11, -84, 3.6, 0, 7); ctx.fill();
    var blink = (t % 3.7) < 0.12;
    ctx.fillStyle = "#1f2937";
    if (blink) { ctx.fillRect(4, -91, 6, 1.6); }
    else { ctx.beginPath(); ctx.arc(7, -91, 2.3, 0, 7); ctx.fill(); }
    ctx.strokeStyle = "#7c2d12"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(7, -84, 4.5, 0.25, 1.6); ctx.stroke();
    // moustache
    ctx.fillStyle = "#92400e"; rr(4, -86.5, 10, 3.2, 1.6); ctx.fill();
    // hard hat + lamp
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(1, -95, 18, Math.PI, 0); ctx.fill();
    rr(-19, -97, 41, 6, 3); ctx.fill();
    ctx.fillStyle = "#eab308"; rr(-2, -113, 6, 18, 3); ctx.fill();
    ctx.fillStyle = "#fff7ae"; ctx.beginPath(); ctx.arc(12, -103, 4.5, 0, 7); ctx.fill();
    // arm + pickaxe, rotating at the shoulder
    ctx.save();
    ctx.translate(6, -64);
    ctx.rotate(pickAngle(t));
    ctx.fillStyle = "#92400e"; rr(10, -3, 60, 6, 3); ctx.fill();          // handle
    ctx.save(); ctx.translate(66, 0);
    ctx.fillStyle = "#64748b";
    ctx.beginPath(); ctx.moveTo(-4, -4); ctx.quadraticCurveTo(4, -22, 14, -26); ctx.quadraticCurveTo(6, -12, 4, -2);
    ctx.lineTo(4, 2); ctx.quadraticCurveTo(6, 12, 14, 26); ctx.quadraticCurveTo(4, 22, -4, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#94a3b8"; rr(-6, -6, 12, 12, 3); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#f97316"; rr(-4, -6, 22, 12, 6); ctx.fill();          // sleeve
    ctx.fillStyle = "#ffd2a6"; ctx.beginPath(); ctx.arc(20, 0, 6, 0, 7); ctx.fill(); // hand
    ctx.restore();
    ctx.restore();
  }

  function effects(t) {
    for (var i = 0; i < HITS.length; i++) {
      var d = t - HITS[i];
      if (d < 0 || d > 1.2) continue;
      var big = i % 3 === 2;
      var origin = toScreen(CRYSTAL_X, -55);
      // shard burst
      var count = big ? 16 : 8;
      for (var k = 0; k < count; k++) {
        var seed = i * 31 + k;
        var ang = -Math.PI / 2 + (rnd(seed) - 0.5) * (big ? 6.2 : 2.6);
        var sp = (big ? 150 : 110) + rnd(seed + 7) * 90;
        var px = origin[0] + Math.cos(ang) * sp * d * s;
        var py = origin[1] + (Math.sin(ang) * sp * d + 260 * d * d) * s;
        var life = 1 - d / (big ? 1.1 : 0.8);
        if (life <= 0) continue;
        ctx.globalAlpha = life;
        if (k % 3 === 0) { ctx.fillStyle = "#fff"; star(px, py, 1.6 * s); }
        else gem(px, py, (3 + rnd(seed + 3) * 3) * s);
      }
      ctx.globalAlpha = 1;
      // impact ring
      if (d < 0.35) {
        ctx.strokeStyle = "rgba(255,255,255," + (1 - d / 0.35) + ")";
        ctx.lineWidth = 3 * s;
        ctx.beginPath(); ctx.arc(origin[0] - 14 * s, origin[1] + 6 * s, (8 + d * 90) * s, 0, 7); ctx.stroke();
      }
      // "+1"
      if (d < 0.9) {
        var a = 1 - ease(d / 0.9);
        ctx.globalAlpha = a;
        ctx.font = "800 " + Math.round(20 * s) + "px system-ui, -apple-system, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 4 * s; ctx.strokeStyle = "#064e3b"; ctx.fillStyle = "#fff";
        var ty = origin[1] - (40 + 50 * ease(d / 0.9)) * s;
        ctx.strokeText("+1", origin[0] + 10 * s, ty); ctx.fillText("+1", origin[0] + 10 * s, ty);
        ctx.globalAlpha = 1;
      }
      // a gem flies up to the counter
      var f = (d - 0.1) / FLY;
      if (f > 0 && f < 1) {
        var e = ease(f), p = counterPos();
        var cx = origin[0], cy = origin[1] - 30 * s;
        var mx = (cx + p[0]) / 2 + 30 * s, my = Math.min(cy, p[1]) - 60 * s;
        var x = (1 - e) * (1 - e) * cx + 2 * (1 - e) * e * mx + e * e * p[0];
        var y = (1 - e) * (1 - e) * cy + 2 * (1 - e) * e * my + e * e * p[1];
        gem(x, y, (8 - 3 * e) * s);
      }
    }
  }

  function counterPos() { return [18 * s + 16 * s, 18 * s + 15 * s]; }
  function hud(t) {
    // collected = gems that have landed in the counter
    var got = 0, lastLand = -9;
    for (var i = 0; i < HITS.length; i++) {
      var land = HITS[i] + 0.1 + FLY;
      if (t >= land) { got++; lastLand = land; }
    }
    var pop = t - lastLand < 0.25 ? 1 + 0.18 * Math.sin((t - lastLand) / 0.25 * Math.PI) : 1;
    var x = 18 * s, y = 18 * s, w = 74 * s, h = 30 * s;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2); ctx.scale(pop, pop); ctx.translate(-(x + w / 2), -(y + h / 2));
    ctx.fillStyle = "rgba(6,40,28,.88)"; rr(x, y, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = "rgba(163,217,119,.55)"; ctx.lineWidth = 1.5 * s; ctx.stroke();
    gem(x + 16 * s, y + h / 2, 8 * s);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "800 " + Math.round(16 * s) + "px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(String(got), x + 31 * s, y + h / 2 + 1 * s);
    ctx.restore();
    // caption
    ctx.fillStyle = "rgba(18,58,42,.6)";
    ctx.font = "700 " + Math.round(7.5 * s) + "px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = (1.6 * s) + "px";
    ctx.fillText("MADE WITH ADLAB", W / 2 + 0.8 * s, y + 52 * s);
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "0px";
    // tap hint before the first strike
    if (t > 0.3 && t < 1.25) {
      var o = toScreen(CRYSTAL_X + 26, -18), k = (t - 0.3) / 0.95;
      ctx.globalAlpha = Math.min(1, k * 3) * (k > 0.85 ? (1 - k) / 0.15 : 1);
      hand(o[0] + (1 - ease(k)) * 30 * s, o[1] + (1 - ease(k)) * 30 * s, k > 0.75 ? 0.9 : 1);
      ctx.globalAlpha = 1;
    }
    // INSTALL button
    if (t >= CTA_AT) {
      var sc = back((t - CTA_AT) / 0.45) * (1 + 0.035 * Math.sin((t - CTA_AT) * 6));
      var bw = 150 * s, bh = 46 * s, bx = W / 2, by = H - 64 * s;
      ctx.save(); ctx.translate(bx, by); ctx.scale(sc, sc);
      ctx.fillStyle = "rgba(180,110,10,.35)"; rr(-bw / 2, -bh / 2 + 5 * s, bw, bh, bh / 2); ctx.fill();
      var g = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
      g.addColorStop(0, "#fbbf24"); g.addColorStop(1, "#f59e0b");
      ctx.fillStyle = g; rr(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.32)"; rr(-bw / 2 + 10 * s, -bh / 2 + 5 * s, bw - 20 * s, bh * 0.32, bh * 0.16); ctx.fill();
      ctx.fillStyle = "#3a2a06";
      ctx.font = "900 " + Math.round(18 * s) + "px system-ui, -apple-system, Segoe UI, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (ctx.letterSpacing !== undefined) ctx.letterSpacing = (1.5 * s) + "px";
      ctx.fillText("INSTALL", 0.75 * s, 1 * s);
      if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "0px";
      ctx.restore();
    }
  }
  function hand(x, y, k) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k); ctx.rotate(-0.4);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#123a2a"; ctx.lineWidth = 2;
    rr(-5, -22, 10, 26, 5); ctx.fill(); ctx.stroke();
    rr(-11, -2, 22, 20, 8); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function render(t) {
    s = Math.min(W / 270, H / 470);
    gx = W / 2; gy = H * 0.7;
    background(t);
    crystal(t);
    miner(t);
    effects(t);
    hud(t);
    // soft white fade into the next loop
    var fade = t > LOOP - 0.45 ? (t - (LOOP - 0.45)) / 0.45 : t < 0.25 ? 1 - t / 0.25 : 0;
    if (fade > 0) { ctx.fillStyle = "rgba(255,253,246," + fade * 0.9 + ")"; ctx.fillRect(0, 0, W, H); }
  }

  // ── loop ──
  var STILL = 8.4;     // the frame shown when motion is reduced: counter full, INSTALL showing
  var running = false, start = 0, raf = 0;
  function frame(now) {
    if (!start) start = now;
    render(((now - start) / 1000) % LOOP);
    raf = requestAnimationFrame(frame);
  }
  function apply() {
    var pin = /[#&]t=([\d.]+)/.exec(location.hash);   // #t=6.1 freezes one frame (handy for screenshots)
    if (pin) STILL = parseFloat(pin[1]) % LOOP;
    var still = !!pin || (reduce && reduce.matches);
    if (still && running) { cancelAnimationFrame(raf); running = false; }
    if (!still && !running) { running = true; start = 0; raf = requestAnimationFrame(frame); }
    if (still) render(STILL);
  }
  window.addEventListener("resize", resize);
  if (reduce) {
    if (reduce.addEventListener) reduce.addEventListener("change", apply);
    else if (reduce.addListener) reduce.addListener(apply);
  }
  resize();
  apply();
})();
</script>
</body>
</html>
