<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Block Blast</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0b1026; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    background: radial-gradient(120% 85% at 50% -5%, #22347e 0%, #0b1026 68%); }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: #fff; }
  .logo { font-weight: 800; letter-spacing: .5px; font-size: 14px; }
  .logo b { color: #ffd54a; }
  .score { font-weight: 800; font-size: 13px; background: rgba(255,255,255,.1); padding: 4px 11px; border-radius: 10px; min-width: 26px; text-align: center; }
  canvas { flex: 1; width: 100%; display: block; }
  .cta { margin: 0 14px 14px; padding: 12px; text-align: center; font-weight: 800; font-size: 15px; color: #20160a;
    background: linear-gradient(180deg, #ffd54a, #f5a623); border-radius: 13px; box-shadow: 0 5px 0 #c77f12; animation: p 1.1s ease-in-out infinite; }
  @keyframes p { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  .hand { position: absolute; font-size: 28px; pointer-events: none; opacity: 0; z-index: 6;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)); transition: opacity .2s; }
  .badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: 1.5px;
    color: #bfe; background: rgba(0,0,0,.28); padding: 3px 9px; border-radius: 999px; z-index: 4; }
</style>
</head>
<body>
<div id="wrap">
  <header><div class="logo">BLOCK <b>BLAST</b></div><div class="score" id="sc">0</div></header>
  <canvas id="c"></canvas>
  <div class="cta">▶ PLAY NOW</div>
</div>
<div class="hand" id="hand">👆</div>
<script>
(function () {
  var cv = document.getElementById('c'), x = cv.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var N = 8, board = [], score = 0;
  var scEl = document.getElementById('sc'), hand = document.getElementById('hand');
  var pal = ['#ff5d73', '#ffd54a', '#4ad6ff', '#7cf29c', '#c78bff', '#ff9f43'];
  var W, H, cell, ox, oy;
  function size() {
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    W = cv.width; H = cv.height; cell = Math.floor(Math.min(W / N, H / N));
    ox = (W - cell * N) / 2; oy = (H - cell * N) / 2;
  }
  window.addEventListener('resize', size); size();

  function emptyBoard() { board = []; for (var r = 0; r < N; r++) { var row = []; for (var c = 0; c < N; c++) row.push(0); board.push(row); } }
  function seed() { emptyBoard(); var n = 15; while (n-- > 0) { var r = (Math.random() * N) | 0, c = (Math.random() * N) | 0; board[r][c] = 1 + ((Math.random() * pal.length) | 0); } }
  seed();

  function rrect(a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
  function blk(px, py, s, ci, a) {
    x.globalAlpha = a == null ? 1 : a; var pad = s * 0.06, rad = s * 0.2;
    x.fillStyle = pal[ci - 1]; rrect(px + pad, py + pad, s - 2 * pad, s - 2 * pad, rad); x.fill();
    x.fillStyle = 'rgba(255,255,255,.22)'; rrect(px + pad, py + pad, s - 2 * pad, (s - 2 * pad) * 0.42, rad); x.fill();
    x.globalAlpha = 1;
  }
  function draw(active, clearing, t) {
    x.clearRect(0, 0, W, H);
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      x.fillStyle = 'rgba(255,255,255,.05)'; rrect(ox + c * cell + 2, oy + r * cell + 2, cell - 4, cell - 4, cell * 0.2); x.fill();
      if (board[r][c]) blk(ox + c * cell, oy + r * cell, cell, board[r][c]);
    }
    if (clearing) {
      x.globalAlpha = 0.75 * (1 - t); x.fillStyle = '#fff';
      clearing.rows.forEach(function (r) { x.fillRect(ox, oy + r * cell, cell * N, cell); });
      clearing.cols.forEach(function (c) { x.fillRect(ox + c * cell, oy, cell, cell * N); });
      x.globalAlpha = 1;
    }
    if (active) active.cells.forEach(function (cl) {
      blk(ox + (active.c + cl[1]) * cell + active.dx, oy + (active.r + cl[0]) * cell + active.dy, cell, active.ci);
    });
  }
  function fullLines() {
    var rows = [], cols = [], r, c, f;
    for (r = 0; r < N; r++) { f = 1; for (c = 0; c < N; c++) if (!board[r][c]) f = 0; if (f) rows.push(r); }
    for (c = 0; c < N; c++) { f = 1; for (r = 0; r < N; r++) if (!board[r][c]) f = 0; if (f) cols.push(c); }
    return { rows: rows, cols: cols };
  }
  function planMove() {
    var best = -1, bestCount = -1, r, c;
    for (r = 0; r < N; r++) { var cnt = 0, full = 1; for (c = 0; c < N; c++) { if (board[r][c]) cnt++; else full = 0; } if (!full && cnt > bestCount) { bestCount = cnt; best = r; } }
    if (best < 0) { seed(); return planMove(); }
    var runs = [], cur = [];
    for (c = 0; c < N; c++) { if (!board[best][c]) cur.push(c); else { if (cur.length) runs.push(cur); cur = []; } }
    if (cur.length) runs.push(cur);
    runs.sort(function (a, b) { return b.length - a.length; });
    var run = runs[0], take = Math.min(run.length, 4), startc = run[0], cells = [];
    for (var i = 0; i < take; i++) cells.push([0, i]);
    return { r: best, c: startc, cells: cells, ci: 1 + ((Math.random() * pal.length) | 0), dx: 0, dy: 0 };
  }

  var active = null, phase = 'pause', t0 = performance.now(), clearing = null;
  function startCycle() { active = planMove(); active.dy = H; phase = 'slide'; t0 = performance.now(); }
  function loop(now) {
    if (phase === 'slide') {
      var d = (now - t0) / 460; if (d > 1) d = 1; var e = 1 - Math.pow(1 - d, 3);
      active.dy = H * (1 - e);
      hand.style.opacity = '0.95';
      hand.style.left = ((ox + active.c * cell) / dpr + cell / dpr * 0.45) + 'px';
      hand.style.top = ((oy + active.r * cell + active.dy) / dpr + cell / dpr * 0.55) + 'px';
      draw(active, null, 0);
      if (d >= 1) {
        active.cells.forEach(function (cl) { board[active.r + cl[0]][active.c + cl[1]] = active.ci; });
        score += active.cells.length * 2; scEl.textContent = score;
        var fl = fullLines();
        if (fl.rows.length || fl.cols.length) { clearing = fl; phase = 'clear'; t0 = now; }
        else { active = null; phase = 'pause'; t0 = now; hand.style.opacity = '0'; }
      }
    } else if (phase === 'clear') {
      var dc = (now - t0) / 420; if (dc > 1) dc = 1;
      draw(null, clearing, dc);
      if (dc >= 1) {
        clearing.rows.forEach(function (r) { for (var c = 0; c < N; c++) board[r][c] = 0; });
        clearing.cols.forEach(function (c) { for (var r = 0; r < N; r++) board[r][c] = 0; });
        score += (clearing.rows.length + clearing.cols.length) * 18; scEl.textContent = score;
        clearing = null; active = null; phase = 'pause'; t0 = now; hand.style.opacity = '0';
      }
    } else {
      draw(null, null, 0);
      if (now - t0 > 360) { if (score > 650) { score = 0; scEl.textContent = 0; seed(); } startCycle(); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
